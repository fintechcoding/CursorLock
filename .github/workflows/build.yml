name: Build Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cursorlock-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # One-time source import for the initial browser-created repository.
      # Subsequent runs build the checked-in source without using this payload.
      - name: Import initial source if needed
        if: hashFiles('src/CursorLock/CursorLock.csproj') == ''
        run: |
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          $payload = ''
          [IO.File]::WriteAllBytes('.tools/source.zip', [Convert]::FromBase64String($payload))
          Expand-Archive -LiteralPath .tools/source.zip -DestinationPath . -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts installer docs .gitignore global.json NuGet.Config README.md RELEASE_NOTES.md
          git commit -m 'Add CursorLock application, installer and tests'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run automated checks
        run: ./scripts/test.ps1
      - name: Install official Inno Setup compiler
        run: |
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile '.tools/inno-setup.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath '.tools/inno-setup.exe'
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Inno Setup signature verification failed.' }
          $compilerDirectory = Join-Path $PWD '.tools/inno'
          $process = Start-Process -FilePath '.tools/inno-setup.exe' -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/PORTABLE=1',('/DIR="' + $compilerDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build installer and portable ZIP
        run: ./scripts/build.ps1 -InnoCompiler (Join-Path $PWD '.tools/inno/ISCC.exe')
      - uses: actions/upload-artifact@v7
        with:
          name: CursorLock-Windows-x64
          path: |
            artifacts/CursorLock-Setup.exe
            artifacts/CursorLock-Portable-win-x64.zip
            artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Publish first release
        if: github.run_number == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 artifacts/CursorLock-Setup.exe artifacts/CursorLock-Portable-win-x64.zip artifacts/SHA256SUMS.txt --title 'CursorLock 1.0.0' --notes-file RELEASE_NOTES.md --target (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
